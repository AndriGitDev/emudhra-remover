name: macOS native fixtures
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  isolated-files:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.0'
      - run: uv sync --frozen --python 3.12
      - name: Validate temporary profile files without installing them
        run: uv run pytest -q -s native_tests/macos
