name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.0'
      - run: sudo apt-get update && sudo apt-get install -y libnss3-tools
      - name: Extract p11-kit tools for isolated native probes
        run: |
          mkdir -p "$RUNNER_TEMP/emudhra-p11"
          cd "$RUNNER_TEMP/emudhra-p11"
          apt-get download p11-kit p11-kit-modules
          for package in *.deb; do dpkg-deb -x "$package" runtime; done
          echo "EMUDHRA_TEST_TRUST=$PWD/runtime/usr/bin/trust" >> "$GITHUB_ENV"
          echo "EMUDHRA_TEST_P11_MODULE=$PWD/runtime/usr/lib/x86_64-linux-gnu/pkcs11/p11-kit-trust.so" >> "$GITHUB_ENV"
      - name: Fetch pinned Bouncy Castle provider for temporary-store tests
        run: |
          curl -fL --retry 3 https://repo.maven.apache.org/maven2/org/bouncycastle/bcprov-jdk18on/1.83/bcprov-jdk18on-1.83.jar -o "$RUNNER_TEMP/bcprov.jar"
          echo "82cf3a2af766c3bc874f6d36b9f20a8b99a8f09762dc776e8a227a45d8daaafb  $RUNNER_TEMP/bcprov.jar" | sha256sum -c -
          echo "EMUDHRA_TEST_BC_JAR=$RUNNER_TEMP/bcprov.jar" >> "$GITHUB_ENV"
      - run: uv sync --frozen --python ${{ matrix.python }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv build
