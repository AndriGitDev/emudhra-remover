name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.0'
      - run: sudo apt-get update && sudo apt-get install -y libnss3-tools
      - name: Extract p11-kit tools for isolated native probes
        run: |
          mkdir -p "$RUNNER_TEMP/emudhra-p11"
          cd "$RUNNER_TEMP/emudhra-p11"
          apt-get download p11-kit p11-kit-modules
          for package in *.deb; do dpkg-deb -x "$package" runtime; done
          echo "EMUDHRA_TEST_TRUST=$PWD/runtime/usr/bin/trust" >> "$GITHUB_ENV"
          echo "EMUDHRA_TEST_P11_MODULE=$PWD/runtime/usr/lib/x86_64-linux-gnu/pkcs11/p11-kit-trust.so" >> "$GITHUB_ENV"
      - run: uv sync --frozen --python ${{ matrix.python }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv build
